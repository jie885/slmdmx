[package]
name = "slime-adventure"
version = "1.3.1"
description = "史莱姆大冒险 - 100层地下城像素回合制闯关"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "slime_adventure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
